name: APK de prueba

on:
  push:
    branches: [ci/prueba-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests y APK debug
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest jacocoTestReport assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-tests
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
      - uses: actions/upload-artifact@v4
        with:
          name: NutriExpert-demo
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Guardar el APK en la rama para descargarlo
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/NutriExpert-demo.apk
          git config user.name "matias"
          git config user.email "mat.figueroae@duocuc.cl"
          git add -f apk/NutriExpert-demo.apk
          git commit -m "build: APK de prueba"
          git push origin HEAD:ci/prueba-app
