# Configuración para probar en el PC (perfil por defecto)
spring.application.name=predios
server.port=8081

# H2: base de datos en memoria. Se borra cada vez que se apaga el programa.
spring.datasource.url=jdbc:h2:mem:predios
spring.datasource.username=sa
spring.datasource.password=

# Crea o actualiza las tablas solo, a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2 para mirar las tablas: http://localhost:8081/h2-console
spring.h2.console.enabled=true
