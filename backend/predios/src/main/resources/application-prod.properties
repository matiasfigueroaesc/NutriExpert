# Configuración para la EC2 (se activa con: java -jar predios-1.0.jar --spring.profiles.active=prod)
# Los datos de conexión se leen de variables de entorno; si no existen, usa los valores después de ":".
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:3306/${DB_NAME:nutriexpert}
spring.datasource.username=${DB_USER:nutriexpert}
spring.datasource.password=${DB_PASSWORD:}

# En la EC2 no se usa la consola de H2
spring.h2.console.enabled=false
